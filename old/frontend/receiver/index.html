<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhwani Sutra - Transcript Receiver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #11998e;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status {
            padding: 12px 20px;
            border-radius: 25px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .status.disconnected {
            background: #fee;
            color: #c33;
        }

        .status.connecting {
            background: #ffeaa7;
            color: #d63031;
        }

        .status.connected {
            background: #dff0d8;
            color: #3c763d;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .session-info {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 13px;
        }

        .session-info strong {
            color: #11998e;
        }

        .transcript-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            min-height: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .transcript-header h2 {
            color: #333;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background: #c0392b;
        }

        .btn-copy {
            background: #3498db;
            color: white;
        }

        .btn-copy:hover {
            background: #2980b9;
        }

        .transcript-content {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
        }

        .transcript-line {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .transcript-line.partial {
            background: #f0f8ff;
            color: #666;
            font-style: italic;
        }

        .transcript-line.final {
            background: #f9f9f9;
        }

        .transcript-line.new {
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confidence {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .stats {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #11998e;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .config {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 13px;
        }

        .config label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        .config input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Dhwani Sutra</h1>
            <p class="subtitle">Real-time Speech-to-Text Receiver</p>

            <div>
                <span id="status" class="status disconnected">
                    <span class="status-dot"></span>
                    Disconnected
                </span>
            </div>

            <div id="sessionInfo" class="session-info" style="display: none;">
                <div><strong>Session ID:</strong> <span id="sessionId">-</span></div>
            </div>

            <div class="config">
                <label for="sessionIdInput">Session ID:</label>
                <input type="text" id="sessionIdInput" placeholder="Enter session ID or use URL parameter">
            </div>
        </div>

        <div class="transcript-container">
            <div class="transcript-header">
                <h2>Live Transcript</h2>
                <div class="controls">
                    <button id="copyBtn" class="btn btn-copy">📋 Copy</button>
                    <button id="clearBtn" class="btn btn-clear">🗑️ Clear</button>
                </div>
            </div>

            <div id="transcriptContent" class="transcript-content">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                    <p>Waiting for audio stream...</p>
                    <p style="font-size: 14px; margin-top: 10px;">Enter a session ID above to connect</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalWords">0</div>
                    <div class="stat-label">Total Words</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="finalTranscripts">0</div>
                    <div class="stat-label">Final Transcripts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="connectionTime">00:00</div>
                    <div class="stat-label">Connection Time</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
